name: Static site (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check Pages bundle paths
        run: bash .github/check-pages-bundle.sh
      - name: Prepare app bundle (kun offentlig app)
        run: |
          set -euo pipefail
          mkdir -p _site
          for path in index.html 404.html sw.js manifest.webmanifest CNAME css js data icons home kart tur; do
            test -e "$path"
            cp -a "$path" _site/
          done
          rm -f _site/data/map-config.local.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4